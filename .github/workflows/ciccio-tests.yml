name: Ciccio tests

on:
  push:
    branches:
      - main
    paths:
      - "ciccio/**"
      - ".github/workflows/ciccio-tests.yml"
      - ".github/workflows/ciccio-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "groq>=0.9,<1.0" "supabase>=2.4,<3.0" "streamlit>=1.30"
      - name: Compile Ciccio Python files
        run: python -m py_compile ciccio/app.py ciccio/agent_runner.py ciccio/test_agent_runner.py
      - name: Run Ciccio unit tests
        run: python -m unittest discover -s ciccio -p "test_*.py" -v
