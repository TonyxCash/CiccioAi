name: Ciccio tests

on:
  pull_request:
    paths:
      - "ciccio/**"
      - ".github/workflows/ciccio-tests.yml"
      - ".github/workflows/ciccio-agent.yml"
  push:
    branches: [main]
    paths:
      - "ciccio/**"
      - ".github/workflows/ciccio-tests.yml"
      - ".github/workflows/ciccio-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "groq>=0.9,<1.0" "supabase>=2.4,<3.0"
      - name: Compile Ciccio files
        run: python -m py_compile ciccio/app.py ciccio/agent_runner.py ciccio/artifacts.py ciccio/package_artifacts.py ciccio/offer_page.py
      - name: Run Ciccio tests
        run: python -m unittest discover -s ciccio -p "test_*.py" -v
