name: Ciccio failure diagnosis

on:
  workflow_run:
    workflows:
      - Ciccio tests
      - Ciccio autonomous agent cycle
    types: [completed]
    branches: [main]

permissions:
  actions: read
  issues: write
  contents: read

concurrency:
  group: ciccio-failure-diagnosis-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Collect failed jobs and open a diagnostic issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const failed = data.jobs.filter(job => job.conclusion === "failure");
            const jobLines = failed.length
              ? failed.map(job => `- **${job.name}** — job ID ${job.id}; ${job.html_url}`).join("\n")
              : "- GitHub ha segnalato un errore, ma non ha restituito job falliti.";
            const title = `Ciccio: diagnosi necessaria — run ${run.id}`;
            const marker = `<!-- ciccio-run:${run.id} -->`;
            const body = [
              marker,
              "## Rilevato un errore automatico",
              "",
              `- Workflow: **${run.name}**`,
              `- Branch: ${run.head_branch}`,
              `- Commit: \`${run.head_sha}\``,
              `- Esecuzione: ${run.html_url}`,
              "",
              "## Job falliti",
              jobLines,
              "",
              "## Procedura sicura",
              "- Questa segnalazione non modifica il codice e non ripete azioni esterne.",
              "- Esaminare i log, identificare la causa e preparare una correzione isolata.",
              "- Eseguire compilazione e test prima di proporre la modifica.",
              "- Nessuna correzione viene unita automaticamente a `main`.",
              "",
              "Creato automaticamente da **Ciccio failure diagnosis**."
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            if (existing.data.some(issue => !issue.pull_request && issue.body?.includes(marker))) {
              core.info("Una segnalazione per questa esecuzione esiste già.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info("Segnalazione diagnostica creata.");
