name: Ciccio autonomous agent cycle

on:
  workflow_dispatch:
  schedule:
    # Six-hour cycle: continuous operation without exhausting free GitHub Actions minutes.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ciccio-agent-cycle
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ciccio dependencies
        run: python -m pip install --disable-pip-version-check "groq>=0.9,<1.0" "supabase>=2.4,<3.0"
      - name: Validate Ciccio Python files
        run: python -m py_compile ciccio/app.py ciccio/agent_runner.py
      - name: Test Ciccio agent safety rules
        run: python -m unittest discover -s ciccio -p "test_*.py" -v
      - name: Run one autonomous Ciccio cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CICCIO_USER_ID: ${{ secrets.CICCIO_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python ciccio/agent_runner.py
