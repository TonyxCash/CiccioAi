name: Ciccio autonomous agent cycle

on:
  workflow_dispatch:
  schedule:
    # Six-hour cycle: continuous operation without exhausting free GitHub Actions minutes.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ciccio-agent-cycle
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      offer_page_created: ${{ steps.offer_page.outputs.created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ciccio dependencies
        run: python -m pip install --disable-pip-version-check "groq>=0.9,<1.0" "supabase>=2.4,<3.0"
      - name: Validate Ciccio Python files
        run: python -m py_compile ciccio/app.py ciccio/agent_runner.py ciccio/artifacts.py ciccio/package_artifacts.py ciccio/offer_page.py
      - name: Test Ciccio agent safety rules
        run: python -m unittest discover -s ciccio -p "test_*.py" -v
      - name: Run one autonomous Ciccio cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CICCIO_USER_ID: ${{ secrets.CICCIO_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python ciccio/agent_runner.py
      - name: Prepare shareable offer page
        id: offer_page
        if: always()
        shell: bash
        run: |
          python ciccio/offer_page.py | tee /tmp/ciccio-offer-page.log
          if grep -q '^Pagina offerta creata:' /tmp/ciccio-offer-page.log; then
            echo 'created=true' >> "$GITHUB_OUTPUT"
          else
            echo 'created=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Package Ciccio work products
        if: always()
        run: python ciccio/package_artifacts.py
      - name: Upload Ciccio work products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciccio-work-products-${{ github.run_number }}
          path: |
            ciccio_output/*.md
            ciccio_output/index.html
            ciccio_output/offer-page.html
            ciccio_output/ciccio-work-products.zip
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish cycle status summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Ciccio autonomous cycle"
            echo "- Workflow result: ${JOB_STATUS}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Download the bundled work products from this run's Artifacts section."
            echo "- The detailed execution log is available in the job output."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_offer:
    needs: agent
    if: needs.agent.outputs.offer_page_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download generated offer page
        uses: actions/download-artifact@v4
        with:
          name: ciccio-work-products-${{ github.run_number }}
          path: ciccio_output
      - name: Prepare Pages site
        run: |
          test -s ciccio_output/offer-page.html
          mkdir -p _site
          cp ciccio_output/offer-page.html _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy offer page
        id: deployment
        uses: actions/deploy-pages@v4
