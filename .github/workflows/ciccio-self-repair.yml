name: Ciccio controlled self-repair

on:
  workflow_run:
    workflows:
      - Ciccio tests
      - Ciccio autonomous agent cycle
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: ciccio-self-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main branch without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ciccio dependencies
        run: python -m pip install --disable-pip-version-check 'groq>=0.9,<1.0' 'supabase>=2.4,<3.0'
      - name: Generate and validate one bounded repair
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          CICCIO_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ciccio/self_repair.py
      - name: Publish the already-tested proposal as a draft PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CICCIO_FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          branch="ciccio/repair-${CICCIO_FAILED_RUN_ID}"
          if git show-ref --verify --quiet "refs/heads/${branch}"; then
            gh auth setup-git
            git push origin "${branch}"
            gh pr create --draft --base main --head "${branch}" --title "Ciccio: riparazione controllata run ${CICCIO_FAILED_RUN_ID}" --body-file /tmp/ciccio-pr-body.md || echo "PR già esistente o non creabile; verificare il branch."
          else
            echo "Nessuna patch sicura ha superato i test; nessuna PR creata."
          fi
